,Consolas,monospace" font-size="10.5" font-weight="400" letter-spacing="0" fill="#9fe1cb" text-anchor="middle" dominant-baseline="middle">HTTP :80</text><path d="M110,408.25 A 77.5,23.25 0 0 1 265,408.25 L 265,489.75 A 77.5,23.25 0 0 1 110,489.75 Z" fill="#3d2c63" stroke="#b39ae6" stroke-width="1.7"></path><ellipse cx="187.5" cy="408.25" rx="77.5" ry="23.25" fill="#3d2c63" stroke="#b39ae6" stroke-width="1.7"></ellipse><path d="M114,411.25 A 73.5,21.25 0 0 0 261,411.25" fill="none" stroke="#b39ae6" stroke-width="1" opacity="0.5"></path><text x="187.5" y="459.0" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#d6c7f5" text-anchor="middle" dominant-baseline="middle">overrides</text><text x="187.5" y="473.8" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#d6c7f5" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text><text x="187.5" y="487.0" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="0" fill="#bfa6ea" text-anchor="middle" dominant-baseline="middle">:5432</text><rect x="555" y="205" width="215" height="135" rx="9" fill="#633806" stroke="#ef9f27" stroke-width="1.7"></rect><rect x="559" y="209" width="207" height="127" rx="6" fill="none" stroke="#ef9f27" stroke-width="1.1"></rect><text x="662.5" y="235.5" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#fac775" text-anchor="middle" dominant-baseline="middle">ESP32</text><text x="662.5" y="251.0" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#fac775" text-anchor="middle" dominant-baseline="middle">Traffic light tile</text><circle cx="754" cy="221" r="5.5" fill="#1f1e1c" stroke="#ef9f27" stroke-width="1.6"></circle><circle cx="754" cy="221" r="2.2" fill="#ef9f27"></circle><text x="662.5" y="318.0" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#c89a55" text-anchor="middle" dominant-baseline="middle">+ LED actuator</text><circle cx="640.5" cy="296" r="6" fill="#d9534f" stroke="#2a1c06" stroke-width="1"></circle><circle cx="662.5" cy="296" r="6" fill="#ef9f27" stroke="#2a1c06" stroke-width="1"></circle><circle cx="684.5" cy="296" r="6" fill="#5dcaa5" stroke="#2a1c06" stroke-width="1"></circle><line x1="167" y1="173" x2="187" y2="232" stroke="#BA7517" stroke-width="2" marker-end="url(#ah)"></line><rect x="211.4" y="178.5" width="177.2" height="35.0" rx="5" fill="#1f1e1c" stroke="#3a3833" stroke-width="1"></rect><text x="300" y="189.5" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="0" fill="#9fe1cb" text-anchor="middle" dominant-baseline="middle">HTTP POST :80</text><text x="300" y="202.5" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="0" fill="#9fe1cb" text-anchor="middle" dominant-baseline="middle">/api/v1/override/emergency</text><line x1="187" y1="316" x2="187" y2="385" stroke="#BA7517" stroke-width="2" marker-end="url(#ah)"></line><rect x="227.8" y="326.5" width="204.5" height="47.0" rx="5" fill="#1f1e1c" stroke="#3a3833" stroke-width="1"></rect><text x="330" y="337.5" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#d6c7f5" text-anchor="middle" dominant-baseline="middle">writes active row:</text><text x="330" y="350.0" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#d6c7f5" text-anchor="middle" dominant-baseline="middle">command=all_red · target=traffic</text><text x="330" y="362.5" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#d6c7f5" text-anchor="middle" dominant-baseline="middle">reason=emergency_vehicle</text><line x1="555" y1="256" x2="292" y2="256" stroke="#BA7517" stroke-width="2" marker-end="url(#ah)"></line><rect x="258.9" y="227.5" width="328.2" height="21.0" rx="5" fill="#1f1e1c" stroke="#3a3833" stroke-width="1"></rect><text x="423" y="238.0" font-family="&#39;SF Mono&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#fac775" text-anchor="middle" dominant-baseline="middle">HTTP GET :80  /override/active?target=traffic  (poll)</text><line x1="292" y1="300" x2="555" y2="300" stroke="#BA7517" stroke-width="2" marker-end="url(#ah)"></line><rect x="351.8" y="307.3" width="142.5" height="21.5" rx="5" fill="#1f1e1c" stroke="#3a3833" stroke-width="1"></rect><text x="423" y="318.0" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#fac775" text-anchor="middle" dominant-baseline="middle">returns all_red command</text><rect x="320" y="400" width="460" height="128" rx="10" fill="#211f1c" stroke="#4a463e" stroke-width="1.2"></rect><rect x="320" y="400" width="4" height="128" rx="2" fill="#BA7517"></rect><text x="338" y="424" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e7e3d7">Reverse command flow</text><text x="338" y="447" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c2c0b6">The backend commands the tile — reverse of the usual</text><text x="338" y="465" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c2c0b6">tile→backend push of sensor data.</text><text x="338" y="483" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c2c0b6">A tile that does not poll is unaffected.</text><text x="338" y="501" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c2c0b6">POST /override/{id}/clear ends the override.</text><rect x="60" y="548" width="720" height="88" rx="16" fill="#211f1c" stroke="#4a463e" stroke-width="1.5"></rect><rect x="78" y="535" width="63.599999999999994" height="26" rx="7" fill="#2f2c27" stroke="#4a463e" stroke-width="1"></rect><text x="109.8" y="548.0" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.2" fill="#d8d4c8" text-anchor="middle" dominant-baseline="middle">Legend</text><rect x="84" y="573" width="30" height="18" rx="9" fill="#3a2204" stroke="#ef9f27" stroke-width="1.7"></rect><rect x="88" y="577" width="22" height="10" rx="6" fill="none" stroke="#ef9f27" stroke-width="1.1"></rect><text x="126" y="582" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11" fill="#c2c0b6" dominant-baseline="middle">Hardware (ESP32 / MCU)</text><rect x="294.6" y="573" width="30" height="18" rx="14" fill="#085041" stroke="#5dcaa5" stroke-width="1.7"></rect><text x="336.6" y="582" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11" fill="#c2c0b6" dominant-baseline="middle">Software / service</text><path d="M484,574.3 A 11,3.3 0 0 1 506,574.3 L 506,589.7 A 11,3.3 0 0 1 484,589.7 Z" fill="#3d2c63" stroke="#b39ae6" stroke-width="1.7"></path><ellipse cx="495" cy="574.3" rx="11" ry="3.3" fill="#3d2c63" stroke="#b39ae6" stroke-width="1.7"></ellipse><path d="M488,577.3 A 7,1.2999999999999998 0 0 0 502,577.3" fill="none" stroke="#b39ae6" stroke-width="1" opacity="0.5"></path><text x="522" y="582" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11" fill="#c2c0b6" dominant-baseline="middle">Database</text><line x1="84" y1="612" x2="112" y2="612" stroke="#BA7517" stroke-width="2" marker-end="url(#ah)"></line><text x="126" y="612" font-family="&#39;Helvetica Neue&#39;,Helvetica,Arial,sans-serif" font-size="11" fill="#c2c0b6" dominant-baseline="middle">Protocol + TCP port</text></svg>