<svg width="100%" viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" style="fill:#faf9f5;font-family:sans-serif;font-size:14px;font-weight:500">City Sim backend architecture (current state)</text>

  <!-- TIER 1: Hardware / Sensors -->
  <text x="40" y="72" style="fill:#c2c0b6;font-family:sans-serif;font-size:12px">Hardware layer — 5 ESP32 tiles</text>

  <!-- Parking sensor -->
  <rect x="40" y="82" width="130" height="56" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="105" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#fac775;font-family:sans-serif;font-size:14px;font-weight:500">Parking sensor</text>
  <text x="105" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#ef9f27;font-family:sans-serif;font-size:12px">ESP32 + sonar</text>

  <!-- Streetlight -->
  <rect x="190" y="82" width="130" height="56" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="255" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#fac775;font-family:sans-serif;font-size:14px;font-weight:500">Streetlight</text>
  <text x="255" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#ef9f27;font-family:sans-serif;font-size:12px">ESP32 + LDR</text>

  <!-- Traffic light -->
  <rect x="340" y="82" width="130" height="56" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="405" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#fac775;font-family:sans-serif;font-size:14px;font-weight:500">Traffic light</text>
  <text x="405" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#ef9f27;font-family:sans-serif;font-size:12px">ESP32 + LEDs</text>

  <!-- Railroad crossing -->
  <rect x="490" y="82" width="130" height="56" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="555" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#fac775;font-family:sans-serif;font-size:14px;font-weight:500">Railroad crossing</text>
  <text x="555" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#ef9f27;font-family:sans-serif;font-size:12px">ESP32 + IR</text>

  <!-- Speed camera -->
  <rect x="640" y="82" width="130" height="56" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="705" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#fac775;font-family:sans-serif;font-size:14px;font-weight:500">Speed camera</text>
  <text x="705" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#ef9f27;font-family:sans-serif;font-size:12px">ESP32 + 2x IR</text>

  <!-- Arrows down from sensors -->
  <line x1="105" y1="138" x2="105" y2="170" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="138" x2="255" y2="170" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="138" x2="405" y2="170" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="555" y1="138" x2="555" y2="170" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="138" x2="705" y2="170" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- WiFi label -->
  <text x="410" y="166" text-anchor="middle" style="fill:#c2c0b6;font-family:sans-serif;font-size:12px">WiFi HTTP POST (JSON)</text>

  <!-- TIER 2: Application layer -->
  <text x="40" y="202" style="fill:#c2c0b6;font-family:sans-serif;font-size:12px">Application layer — Raspberry Pi (145.92.8.137, port 80)</text>

  <!-- Docker Compose container -->
  <rect x="40" y="212" width="740" height="130" rx="16" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
  <text x="410" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#9fe1cb;font-family:sans-serif;font-size:14px;font-weight:500">Docker Compose (restart: always)</text>

  <!-- FastAPI -->
  <rect x="70" y="252" width="200" height="56" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
  <text x="170" y="272" text-anchor="middle" dominant-baseline="central" style="fill:#b5d4f4;font-family:sans-serif;font-size:14px;font-weight:500">FastAPI backend</text>
  <text x="170" y="290" text-anchor="middle" dominant-baseline="central" style="fill:#85b7eb;font-family:sans-serif;font-size:12px">7 routers, 20+ endpoints</text>

  <!-- PostgreSQL -->
  <rect x="300" y="252" width="190" height="56" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
  <text x="395" y="272" text-anchor="middle" dominant-baseline="central" style="fill:#cecbf6;font-family:sans-serif;font-size:14px;font-weight:500">PostgreSQL 16</text>
  <text x="395" y="290" text-anchor="middle" dominant-baseline="central" style="fill:#afa9ec;font-family:sans-serif;font-size:12px">6 tables, Docker volume</text>

  <!-- Dashboard -->
  <rect x="520" y="252" width="230" height="56" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
  <text x="635" y="272" text-anchor="middle" dominant-baseline="central" style="fill:#f5c4b3;font-family:sans-serif;font-size:14px;font-weight:500">Dashboard (root /)</text>
  <text x="635" y="290" text-anchor="middle" dominant-baseline="central" style="fill:#f0997b;font-family:sans-serif;font-size:12px">HTML + JS, 6 tile panels</text>

  <!-- Arrows between containers -->
  <line x1="270" y1="280" x2="298" y2="280" stroke="#185FA5" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="280" x2="518" y2="280" stroke="#993C1D" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- TIER 3: Outputs -->
  <text x="40" y="378" style="fill:#c2c0b6;font-family:sans-serif;font-size:12px">Output layer</text>

  <!-- E-ink display -->
  <rect x="40" y="388" width="155" height="56" rx="8" fill="#275a0a" stroke="#97c459" stroke-width="0.5"/>
  <text x="117" y="408" text-anchor="middle" dominant-baseline="central" style="fill:#c0dd97;font-family:sans-serif;font-size:14px;font-weight:500">E-ink display</text>
  <text x="117" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#97c459;font-family:sans-serif;font-size:12px">Railroad status</text>

  <!-- LED indicators -->
  <rect x="220" y="388" width="155" height="56" rx="8" fill="#275a0a" stroke="#97c459" stroke-width="0.5"/>
  <text x="297" y="408" text-anchor="middle" dominant-baseline="central" style="fill:#c0dd97;font-family:sans-serif;font-size:14px;font-weight:500">LED indicators</text>
  <text x="297" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#97c459;font-family:sans-serif;font-size:12px">Per tile feedback</text>

  <!-- Web dashboard -->
  <rect x="400" y="388" width="155" height="56" rx="8" fill="#275a0a" stroke="#97c459" stroke-width="0.5"/>
  <text x="477" y="408" text-anchor="middle" dominant-baseline="central" style="fill:#c0dd97;font-family:sans-serif;font-size:14px;font-weight:500">Web dashboard</text>
  <text x="477" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#97c459;font-family:sans-serif;font-size:12px">Realtime overview</text>

  <!-- ESP32-CAM -->
  <rect x="580" y="388" width="155" height="56" rx="8" fill="#275a0a" stroke="#97c459" stroke-width="0.5"/>
  <text x="657" y="408" text-anchor="middle" dominant-baseline="central" style="fill:#c0dd97;font-family:sans-serif;font-size:14px;font-weight:500">ESP32-CAM</text>
  <text x="657" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#97c459;font-family:sans-serif;font-size:12px">Speed violation photo</text>

  <!-- Arrows from API to outputs -->
  <line x1="170" y1="308" x2="117" y2="386" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="308" x2="297" y2="386" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="308" x2="477" y2="386" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="308" x2="657" y2="386" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Documentation note -->
  <rect x="40" y="470" width="740" height="50" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
  <text x="410" y="488" text-anchor="middle" dominant-baseline="central" style="fill:#d3d1c7;font-family:sans-serif;font-size:13px;font-weight:500">DB tables: sensor_readings, parking_spots, train, barrier, speed_readings, traffic</text>
  <text x="410" y="506" text-anchor="middle" dominant-baseline="central" style="fill:#b4b2a9;font-family:sans-serif;font-size:12px">Routers: readings, parking, railroad_train, railroad_barrier, speed_camera, traffic, eink_display</text>
</svg>