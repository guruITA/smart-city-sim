profiles:
  city-sim:
    fqbn: esp32:esp32:esp32c3
    platforms:
      - platform: esp32:esp32
        version: 3.2.0
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: lib/NetworkController
      - dir: lib/Config
      - dir: lib/EinkDisplay
      - GxEPD2 (1.6.9)
      - Adafruit GFX Library (1.12.5)
      - Adafruit SSD1306 (2.5.16)
      - Adafruit BusIO (1.17.4)
      - Adafruit MCP23017 Arduino Library (2.3.2)
    programmer: ""
    port: /dev/ttyACM0
    port_config:
      baudrate: "115200"
      bits: "8"
      parity: none
