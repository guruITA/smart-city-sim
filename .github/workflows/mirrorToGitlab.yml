name: Mirror to GitLab

on:
  push:
    branches:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.fdmci.hva.nl/studio/smart-cities/projecten/2025-2026-semester-2/city-sim-learning-group/city-the-embedded-alliance-city-sim-learning-group.git"

          git remote add gitlab "${GITLAB_URL}"
          git fetch gitlab || true

          # Map the target branch on GitLab
          if [ "${GITHUB_BRANCH}" = "main" ]; then
            TARGET_BRANCH="matin";
          else
            TARGET_BRANCH="${GITHUB_BRANCH}";
          fi

          echo "🚀 Pushing GitHub '${GITHUB_BRANCH}' → GitLab '${TARGET_BRANCH}'..."

          # Try a normal push first
          if git push gitlab "HEAD:refs/heads/${TARGET_BRANCH}"; then
            echo "✅ Push succeeded!"
          else
            echo "⚠️ Fast-forward push failed. Fetching and merging GitLab history..."

            git fetch gitlab "${TARGET_BRANCH}" || true

            if git rev-parse "gitlab/${TARGET_BRANCH}" >/dev/null 2>&1; then
              git merge "gitlab/${TARGET_BRANCH}" --allow-unrelated-histories --no-edit -m "Merge GitLab ${TARGET_BRANCH} history";
            fi

            git push gitlab "HEAD:refs/heads/${TARGET_BRANCH}"
            echo "✅ Merge + push succeeded!"
          fi
