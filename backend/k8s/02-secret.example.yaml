# TEMPLATE. Copy this to 02-secret.yaml and put the real password in it.
#   cp 02-secret.example.yaml 02-secret.yaml   then edit 02-secret.yaml
# 02-secret.yaml is gitignored so the real password never lands in git, the same
# rule as the .env file. The committed example keeps the placeholder only.
#
# POSTGRES_PASSWORD  -> used by the postgres pod to set the database password.
# DATABASE_URL       -> used by the api pods. It embeds the same password, points
#                       at the postgres Service, and matches the format that
#                       backend/app/database.py expects.
apiVersion: v1
kind: Secret
metadata:
  name: citysim-secret
  namespace: citysim
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DATABASE_URL: "postgresql://citysim:REPLACE_WITH_DB_PASSWORD@postgres:5432/citysim"
