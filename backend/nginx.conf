# NGINX reverse proxy and load balancer for the City Sim backend.
# It is the single entry on port 80 and spreads traffic over the API replicas.
events {}

http {
    # Rate limit per client IP, so one misbehaving ESP32 cannot flood the API.
    limit_req_zone $binary_remote_addr zone=tiles:10m rate=10r/s;

    # Docker's internal DNS resolver. Using a variable in proxy_pass forces
    # NGINX to resolve the service name at request time, so it picks up the
    # current set of api replicas instead of caching one IP at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            limit_req zone=tiles burst=20 nodelay;

            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;

            # Short connect timeout so a request aimed at a dead replica fails
            # fast and is retried on a healthy one, keeping failover well under
            # the 5 second target.
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            # If a replica errors or times out, retry the request on another one.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
